<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interval Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Interval Coach">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #0a0a0a;
    --ink-soft: #5a5a5a;
    --ink-faint: #9c9c9c;
    --border: #e2e2e2;
    --accent: #d7ff1e;
    --accent-ink: #0a0a0a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0a;
      --surface: #141414;
      --ink: #f5f5f5;
      --ink-soft: #a3a3a3;
      --ink-faint: #5c5c5c;
      --border: #2a2a2a;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #141414;
    --ink: #f5f5f5;
    --ink-soft: #a3a3a3;
    --ink-faint: #5c5c5c;
    --border: #2a2a2a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .display {
    font-family: 'Anton', 'Arial Narrow', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  [hidden] { display: none !important; }

  /* ---------- App shell (topbar + bottom tabs) ---------- */

  .app-shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .shell-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 12px;
  }

  .shell-wordmark {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
  }

  .shell-wordmark .icon { width: 26px; height: 26px; flex-shrink: 0; }

  .shell-wordmark-text {
    font-weight: 800;
    letter-spacing: 0.08em;
    font-size: 1rem;
    text-transform: uppercase;
  }

  .shell-profile-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: none;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .shell-profile-btn:hover { border-color: var(--ink); }
  .shell-profile-btn .icon { width: 18px; height: 18px; }

  .shell-content {
    flex: 1;
    overflow-y: auto;
  }

  .shell-tabbar {
    display: flex;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
  }

  .shell-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 4px 4px 6px;
    position: relative;
  }

  .shell-tab .icon { width: 22px; height: 22px; }

  .shell-tab-label {
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .shell-tab.active { color: var(--ink); }

  .shell-tab.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
  }

  /* icon */
  .icon { display: inline-block; vertical-align: middle; }
  .icon svg { display: block; width: 100%; height: 100%; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--border); color: var(--ink); }
  .icon-btn .icon { width: 18px; height: 18px; }

  /* ---------- Workouts tab ---------- */

  .home-scroll {
    padding: 4px 20px calc(32px + env(safe-area-inset-bottom, 0px));
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  .hero-title {
    font-weight: 800;
    font-size: clamp(1.7rem, 7vw, 2.2rem);
    line-height: 1.12;
    margin: 4px 0 6px;
    letter-spacing: -0.01em;
  }

  .hero-sub {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .stat-bar {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .stat-bar-item { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
  .stat-bar-value {
    font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400;
    font-size: 1.4rem;
    color: var(--ink);
  }
  .stat-bar-label { font-size: 0.6rem; letter-spacing: 0.04em; color: var(--ink-soft); text-transform: uppercase; }

  .stat-bar-divider { width: 1px; height: 30px; background: var(--border); flex-shrink: 0; }

  .stat-bar-new-btn {
    margin-left: auto;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: var(--accent);
    color: #0a0a0a;
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 11px 16px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .stat-bar-new-btn:hover { filter: brightness(1.05); }

  .section-label-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 12px;
  }
  .section-label-row .section-label { margin: 0; white-space: nowrap; }
  .section-label-row .rule { flex: 1; height: 1px; background: var(--border); }

  .empty-state {
    color: var(--ink-soft);
    font-size: 0.95rem;
    border: 1px dashed var(--border);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
  }

  .workout-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .workout-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .workout-card-main {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    cursor: pointer;
  }

  .workout-card-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--ink);
  }
  .workout-card-icon .icon { width: 22px; height: 22px; }

  .workout-card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  .workout-card-name {
    font-weight: 800;
    font-size: 1.02rem;
  }

  .workout-card-meta {
    color: var(--ink-soft);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .workout-card-chevron { color: var(--ink-faint); flex-shrink: 0; }
  .workout-card-chevron .icon { width: 18px; height: 18px; }

  .card-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }

  .card-action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 0;
  }
  .card-action-btn:hover { color: var(--ink); }
  .card-action-btn .icon { width: 16px; height: 16px; }
  .card-action-btn.icon-only { gap: 0; }

  .card-actions-spacer { flex: 1; }
  .card-actions-divider { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

  /* ---------- Home dashboard card (weekly goal, dark photo style) ---------- */

  .dash-card {
    position: relative;
    border-radius: 16px;
    padding: 20px 20px 18px;
    margin-bottom: 8px;
    overflow: hidden;
    color: #ffffff;
    background:
      linear-gradient(100deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.05) 100%),
      repeating-linear-gradient(115deg, #2b2b2e 0 2px, #232325 2px 46px),
      linear-gradient(160deg, #3a3a3d, #141416 70%);
    isolation: isolate;
  }

  .dash-card::after {
    content: '';
    position: absolute;
    left: 8%;
    top: 0;
    bottom: 0;
    width: 6%;
    background: repeating-linear-gradient(#e8e6df 0 22px, transparent 22px 44px);
    transform: skewX(-18deg);
    opacity: 0.55;
    z-index: -1;
  }

  .dash-card-hit {
    box-shadow: 0 0 0 3px var(--accent) inset;
  }

  .dash-eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .dash-eyebrow-dash {
    width: 16px;
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .dash-eyebrow-label {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #ffffff;
  }

  .dash-big {
    font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: clamp(2.8rem, 13vw, 3.6rem);
    line-height: 1;
    color: #ffffff;
  }
  .dash-label {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-top: 4px;
  }

  .dash-progress-track {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.22);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 16px;
  }
  .dash-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .dash-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    background: none;
    border: none;
    color: #ffffff;
    cursor: pointer;
    padding: 0;
    font-size: 0.86rem;
    font-weight: 700;
  }
  .dash-footer .icon { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }
  .dash-footer .icon-chevron { width: 16px; height: 16px; color: rgba(255,255,255,0.7); margin-left: 2px; }
  .dash-footer:hover { opacity: 0.85; }

  /* ---------- Share / paste overlay ---------- */

  .ic-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    padding: 0;
  }

  @media (min-width: 480px) {
    .ic-overlay { align-items: center; padding: 20px; }
  }

  .ic-overlay-box {
    background: var(--surface);
    color: var(--ink);
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  @media (min-width: 480px) {
    .ic-overlay-box { border-radius: 20px; }
  }

  .ic-code-textarea {
    font: inherit;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.78rem;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    width: 100%;
    min-height: 90px;
    resize: vertical;
  }

  .ic-error {
    color: #ff3b30;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .ic-overlay-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .ic-btn-secondary {
    border: 1px solid var(--border);
    background: none;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 12px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .ic-btn-secondary:hover { color: var(--ink); border-color: var(--ink-soft); }

  .ic-toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: #17171a;
    color: #f4f4f4;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 200;
    max-width: calc(100vw - 40px);
    text-align: center;
  }

  /* ---------- Editor ---------- */

  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px));
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  .editor-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .editor-topbar h2 {
    font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 1.3rem;
    margin: 0;
  }

  .back-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 8px 4px 0;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .field span.field-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .field input, .field select {
    font: inherit;
    font-size: 1rem;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .section-label {
    font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 1rem;
    margin: 24px 0 4px;
  }

  .section-hint {
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin: 0 0 12px;
  }

  .exercise-row {
    display: grid;
    grid-template-columns: 18px 1fr 44px 44px 44px 32px;
    gap: 6px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
  }

  .exercise-row .idx { color: var(--ink-faint); font-weight: 700; font-size: 0.85rem; text-align: center; }

  .exercise-row input {
    font: inherit;
    padding: 8px 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    width: 100%;
    min-width: 0;
    font-size: 0.9rem;
  }

  .exercise-row input.name-input { font-weight: 600; }
  .exercise-row input.time-input { text-align: center; font-variant-numeric: tabular-nums; padding-left: 2px; padding-right: 2px; }

  .exercise-row .remove-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 1rem;
    cursor: pointer;
    padding: 6px;
  }
  .exercise-row .remove-btn:hover { color: #ff3b30; }

  .col-labels {
    display: grid;
    grid-template-columns: 18px 1fr 44px 44px 44px 32px;
    gap: 6px;
    font-size: 0.62rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 10px;
    margin-bottom: 6px;
  }
  .col-labels span:nth-child(3), .col-labels span:nth-child(4), .col-labels span:nth-child(5) { text-align: center; }

  .add-exercise-btn {
    width: 100%;
    border: 1px dashed var(--border);
    background: none;
    color: var(--ink-soft);
    border-radius: 12px;
    padding: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-exercise-btn:hover { border-color: var(--accent); color: var(--accent); }

  .editor-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .total-time {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .save-btn {
    border: 2px solid var(--ink);
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 12px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------- Player (Nike Run Club style stat card) ---------- */

  .player {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    color: #0a0a0a;
    transition: background 0.25s ease;
  }

  .player.stage-active { background: var(--accent); }

  .player-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
    flex-shrink: 0;
  }

  .player-topbar .icon-btn {
    background: rgba(10,10,10,0.06);
    color: #0a0a0a;
  }
  .player-topbar .icon-btn:hover { background: rgba(10,10,10,0.14); }

  .player-title {
    font-weight: 800;
    letter-spacing: 0.05em;
    font-size: 0.95rem;
    text-transform: uppercase;
    color: #0a0a0a;
  }

  .spacer36 { width: 36px; flex-shrink: 0; }

  /* pre-start summary */

  .presummary { display: flex; justify-content: center; gap: 30px; padding: 12px 16px 20px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .presummary-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .presummary-value { font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase; font-size: 1.8rem; color: #0a0a0a; }
  .presummary-label { font-size: 0.62rem; letter-spacing: 0.08em; color: var(--ink-soft); text-transform: uppercase; }

  .preview-list { flex: 1; overflow-y: auto; padding: 8px 20px; max-width: 560px; margin: 0 auto; width: 100%; }
  .preview-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 4px; border-bottom: 1px solid var(--border);
  }
  .preview-row .idx { color: var(--ink-faint); font-weight: 700; width: 18px; flex-shrink: 0; }
  .preview-row .name { flex: 1; font-weight: 700; color: #0a0a0a; }
  .preview-row .times { color: var(--ink-soft); font-size: 0.78rem; flex-shrink: 0; text-align: right; }

  .start-btn {
    flex-shrink: 0;
    margin: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    padding: 18px;
    border: none;
    border-radius: 999px;
    background: #0a0a0a;
    color: #ffffff;
    font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 1.3rem;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .start-btn:hover { filter: brightness(1.2); }

  /* running stat card */

  .phase-band {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 8px 28px 24px;
    text-align: center;
    color: #0a0a0a;
  }

  .phase-topline {
    display: flex;
    justify-content: center;
    gap: 34px;
    padding-bottom: 18px;
    margin-bottom: 18px;
    border-bottom: 1px solid rgba(10,10,10,0.14);
  }

  .phase-topstat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .phase-topstat-value {

  .play-btn {

    * { transition: none !important; }

<body>

<div id="app"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'interval-coach-workouts-v2';
  var GOAL_KEY = 'interval-coach-weekly-goal';
  var LOG_KEY = 'interval-coach-completion-log';
  var PREPARE_SECONDS = 5;
  var COUNT_FROM = 5;

  // ---------------- storage ----------------

  function loadWorkouts() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  function saveWorkouts(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function loadWeeklyGoal() {
    try {
      var raw = localStorage.getItem(GOAL_KEY);
      var n = raw ? parseInt(raw, 10) : 4;
      return Number.isFinite(n) && n > 0 ? n : 4;
    } catch (e) { return 4; }
  }

  function saveWeeklyGoal(n) {
    try { localStorage.setItem(GOAL_KEY, String(n)); } catch (e) {}
  }

  function loadCompletionLog() {
    try {
      var raw = localStorage.getItem(LOG_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [];
  }

  function saveCompletionLog(log) {
    try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) {}
  }

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function recordCompletion() {
    var log = loadCompletionLog();
    log.push(isoDate(new Date()));
    if (log.length > 400) log = log.slice(log.length - 400);
    saveCompletionLog(log);
  }

  // Calendar week starting Monday.
  function startOfWeek(d) {
    var day = d.getDay(); // 0 = Sunday
    var diff = (day === 0 ? -6 : 1 - day);
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
    return start;
  }

  function weekCompletionCount(log) {
    var start = startOfWeek(new Date());
    var startIso = isoDate(start);
    var uniqueDays = {};
    log.forEach(function (dateStr) {
      if (dateStr >= startIso) uniqueDays[dateStr] = true;
    });
    return Object.keys(uniqueDays).length;
  }

  function currentStreak(log) {
    var days = {};
    log.forEach(function (d) { days[d] = true; });
    var streak = 0;
    var cursor = new Date();
    // Today doesn't have to be logged yet for the streak to still be "alive".
    if (!days[isoDate(cursor)]) cursor.setDate(cursor.getDate() - 1);
    while (days[isoDate(cursor)]) {
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function sampleWorkouts() {
    return [
      {
        id: 'wk-sample-1',
        name: 'Push Day',
        exercises: [
          { id: 'ex-1', name: 'Bench press', sets: 4, work: 0, rest: 120 },
          { id: 'ex-2', name: 'Incline press', sets: 4, work: 0, rest: 90 }
        ]
      }
    ];
  }

  var state = {
    workouts: loadWorkouts() || sampleWorkouts(),
    screen: 'workouts', // workouts | progress | settings | editor | player
    editing: null,  // workout object being edited
    editingIsNew: false,
    playing: null   // { workout, segments, index, remaining, running, started, finished }
  };

  if (!loadWorkouts()) saveWorkouts(state.workouts);

  function uid(prefix) {
    return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function fmtClock(totalSeconds) {
    var s = Math.max(0, totalSeconds | 0);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
  }

  function totalSetsCount(w) {
    return w.exercises.reduce(function (sum, ex) { return sum + Math.max(1, ex.sets || 1); }, 0);
  }

  function totalDuration(w) {
    return buildSegments(w).reduce(function (sum, s) { return sum + (s.seconds || 0); }, 0);
  }

  // ---------------- share / import (copy-paste a workout as a text code) ----------------

  var SHARE_PREFIX = 'IC1:';

  function b64EncodeUnicode(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function b64DecodeUnicode(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  function encodeWorkout(w) {
    var payload = {
      n: w.name,
      e: w.exercises.map(function (ex) { return [ex.name, ex.sets, ex.work, ex.rest]; })
    };
    return SHARE_PREFIX + b64EncodeUnicode(JSON.stringify(payload));
  }

  function decodeWorkoutCode(rawCode) {
    var trimmed = (rawCode || '').trim();
    var start = trimmed.indexOf(SHARE_PREFIX);
    if (start === -1) throw new Error("That doesn't look like a workout code.");
    var payload;
    try {
      payload = JSON.parse(b64DecodeUnicode(trimmed.slice(start + SHARE_PREFIX.length)));
    } catch (e) {
      throw new Error("That doesn't look like a workout code.");
    }
    if (!payload || !Array.isArray(payload.e) || !payload.e.length) {
      throw new Error('That code has no exercises in it.');
    }
    return {
      id: uid('wk'),
      name: (payload.n && String(payload.n).trim()) || 'Imported workout',
      exercises: payload.e.map(function (arr) {
        return {
          id: uid('ex'),
          name: (arr[0] && String(arr[0]).trim()) || 'Exercise',
          sets: Math.max(1, parseInt(arr[1], 10) || 1),
          work: Math.max(0, parseInt(arr[2], 10) || 0),
          rest: Math.max(0, parseInt(arr[3], 10) || 0)
        };
      })
    };
  }

  var toastTimer = null;
  function showToast(message) {
    var existing = document.getElementById('ic-toast');
    if (existing) existing.remove();
    var toast = el('div', { id: 'ic-toast', class: 'ic-toast' }, [message]);
    document.body.appendChild(toast);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.remove(); }, 2400);
  }

  function copyWorkoutCode(w) {
    var code = encodeWorkout(w);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () {
        showToast('Copied "' + w.name + '" — paste it anywhere to share.');
      }, function () {
        showCodeOverlay(code);
      });
    } else {
      showCodeOverlay(code);
    }
  }

  function showCodeOverlay(code) {
    var overlay = el('div', { class: 'ic-overlay', onclick: function (e) { if (e.target === overlay) overlay.remove(); } });
    var textarea = document.createElement('textarea');
    textarea.className = 'ic-code-textarea';
    textarea.readOnly = true;
    textarea.value = code;

    var box = el('div', { class: 'ic-overlay-box' }, [
      el('span', { class: 'field-label' }, ['Copy this code to share your workout']),
      textarea,
      el('div', { class: 'ic-overlay-actions' }, [
        el('button', { class: 'ic-btn-secondary', onclick: function () { overlay.remove(); } }, ['Close']),
        el('button', {
          class: 'save-btn',
          onclick: function () {
            textarea.select();
            textarea.setSelectionRange(0, code.length);
            try { document.execCommand('copy'); showToast('Copied!'); } catch (e) {}
          }
        }, ['Copy'])
      ])
    ]);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    textarea.focus();
    textarea.select();
  }

  function openPasteOverlay() {
    var overlay = el('div', { class: 'ic-overlay', onclick: function (e) { if (e.target === overlay) overlay.remove(); } });
    var textarea = document.createElement('textarea');
    textarea.className = 'ic-code-textarea';
    textarea.placeholder = 'Paste a workout code here';

    var errorMsg = el('div', { class: 'ic-error' }, ['']);
    errorMsg.hidden = true;

    function tryAdd() {
      try {
        var workout = decodeWorkoutCode(textarea.value);
        state.workouts.push(workout);
        saveWorkouts(state.workouts);
        overlay.remove();
        render();
        showToast('Added "' + workout.name + '"');
      } catch (e) {
        errorMsg.textContent = e.message || 'Could not read that code.';
        errorMsg.hidden = false;
      }
    }

    var box = el('div', { class: 'ic-overlay-box' }, [
      el('span', { class: 'field-label' }, ['Paste a workout code']),
      textarea,
      errorMsg,
      el('div', { class: 'ic-overlay-actions' }, [
        el('button', { class: 'ic-btn-secondary', onclick: function () { overlay.remove(); } }, ['Cancel']),
        el('button', { class: 'save-btn', onclick: tryAdd }, ['Add workout'])
      ])
    ]);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    textarea.focus();

    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        if (text && text.indexOf(SHARE_PREFIX) !== -1 && !textarea.value) {
          textarea.value = text;
        }
      }, function () {});
    }
  }

  // ---------------- speech / ducking ----------------

  var announcer = (function () {
    var ducked = [];
    function mediaEls() { return Array.prototype.slice.call(document.querySelectorAll('audio,video')); }
    function duck() {
      ducked = mediaEls().filter(function (el) { return !el.paused; });
      ducked.forEach(function (el) { el.dataset.preDuck = el.volume; el.volume = 0.15; });
    }
    function unduck() {
      ducked.forEach(function (el) {
        if (el.dataset.preDuck !== undefined) { el.volume = Number(el.dataset.preDuck); delete el.dataset.preDuck; }
      });
      ducked = [];
    }
    return {
      speak: function (text) {
        if (!('speechSynthesis' in window)) return;
        duck();
        var u = new SpeechSynthesisUtterance(text);
        u.rate = 1.05;
        u.onend = unduck;
        u.onerror = unduck;
        window.speechSynthesis.speak(u);
      },
      cancel: function () {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        unduck();
      }
    };
  })();

  // ---------------- segment engine ----------------
  // Every exercise carries its own set count and its own rest — exercises run
  // one after another (not a shared circuit/round), which matches how a real
  // strength workout is structured: finish all sets of an exercise, then move on.

  function buildSegments(workout) {
    var segments = [];
    var totalExercises = workout.exercises.length;
    if (!totalExercises) return segments;

    segments.push({
      phase: 'prepare', label: 'Get ready', seconds: PREPARE_SECONDS,
      announce: 'Get ready', exerciseNumber: 1, totalExercises: totalExercises,
      setNumber: 1, totalSets: Math.max(1, workout.exercises[0].sets || 1)
    });

    workout.exercises.forEach(function (exercise, exerciseIndex) {
      var totalSets = Math.max(1, exercise.sets || 1);
      var isLastExercise = exerciseIndex === totalExercises - 1;

      for (var setIndex = 0; setIndex < totalSets; setIndex++) {
        var isLastSet = setIndex === totalSets - 1;
        var setLabel = 'set ' + (setIndex + 1) + ' of ' + totalSets;

        if (exercise.work > 0) {
          segments.push({
            phase: 'work', label: exercise.name, seconds: exercise.work,
            announce: 'Begin, ' + exercise.name + ', ' + setLabel,
            exerciseNumber: exerciseIndex + 1, totalExercises: totalExercises,
            setNumber: setIndex + 1, totalSets: totalSets
          });
        } else {
          segments.push({
            phase: 'manual', label: exercise.name, seconds: 0,
            announce: exercise.name + ', ' + setLabel,
            exerciseNumber: exerciseIndex + 1, totalExercises: totalExercises,
            setNumber: setIndex + 1, totalSets: totalSets
          });
        }

        if (exercise.rest > 0 && !(isLastSet && isLastExercise)) {
          var nextLabel;
          if (!isLastSet) {
            nextLabel = exercise.name + ', set ' + (setIndex + 2) + ' of ' + totalSets;
          } else {
            var nextExercise = workout.exercises[exerciseIndex + 1];
            nextLabel = nextExercise ? nextExercise.name : '';
          }
          segments.push({
            phase: 'rest', label: 'Rest', seconds: exercise.rest,
            announce: nextLabel ? ('Rest. Next up, ' + nextLabel) : 'Rest',
            exerciseNumber: exerciseIndex + 1, totalExercises: totalExercises,
            setNumber: setIndex + 1, totalSets: totalSets
          });
        }
      }
    });

    return segments;
  }

  // ---------------- rendering ----------------

  var app = document.getElementById('app');
  var tickTimer = null;

  function render() {
    if (state.screen === 'workouts' || state.screen === 'progress' || state.screen === 'settings') renderShell();
    else if (state.screen === 'editor') renderEditor();
    else if (state.screen === 'player') renderPlayer();
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  // ---------------- icons (inline SVG, currentColor) ----------------

  var ICONS = {
    wave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9c1.8-2.6 3.6-2.6 5.4 0s3.6 2.6 5.4 0 3.6-2.6 5.4 0 3.6 2.6 5.4 0"/><path d="M2 15c1.8-2.6 3.6-2.6 5.4 0s3.6 2.6 5.4 0 3.6-2.6 5.4 0 3.6 2.6 5.4 0" opacity="0.45"/></svg>',
    profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="9" r="3.2"/><path d="M5.5 19c1.6-3.2 4-4.4 6.5-4.4s4.9 1.2 6.5 4.4"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    dumbbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8v8M4 9.5v5M18 8v8M20 9.5v5M6.5 12h11"/></svg>',
    tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M20 13.5 12.5 21 3 11.5V4a1 1 0 0 1 1-1h7.5z"/><circle cx="15" cy="8" r="1.1" fill="currentColor" stroke="none"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    barChart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.7 7.7 0 0 0 0-2l1.9-1.4-2-3.4-2.2.7a7.8 7.8 0 0 0-1.7-1L15 3.6h-4l-.4 2.3a7.8 7.8 0 0 0-1.7 1l-2.2-.7-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-1.9 1.4 2 3.4 2.2-.7a7.8 7.8 0 0 0 1.7 1L11 20.4h4l.4-2.3a7.8 7.8 0 0 0 1.7-1l2.2.7 2-3.4z"/></svg>',
    runner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="14.5" cy="4.8" r="1.6" fill="currentColor" stroke="none"/><path d="M12.5 8l-2 3 3 1.8.6 5.2M8.5 20l2-4-3.2-2 1-4 4.2-1.2 2 2.4 3.3 1"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-3 4-3 7a3 3 0 0 0 6 0c0-1-.5-1.8-1-2.5 2 1 3.5 3 3.5 5.5a5.5 5.5 0 0 1-11 0C6.5 9 9 6 12 3z"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3M9.5 18h5M12 14v4"/><path d="M8.5 21h7"/></svg>'
  };

  function icon(name, extraClass) {
    return el('span', { class: 'icon' + (extraClass ? ' ' + extraClass : ''), html: ICONS[name] || '' });
  }

  // ---------- Home ----------

  // ---------- App shell (topbar + tab content + bottom tabs) ----------

  var TABS = [
    { id: 'workouts', label: 'Workouts', icon: 'wave' },
    { id: 'progress', label: 'Progress', icon: 'barChart' },
    { id: 'settings', label: 'Settings', icon: 'gear' }
  ];

  function renderShell() {
    app.innerHTML = '';
    var shell = el('div', { class: 'app-shell' });

    shell.appendChild(el('div', { class: 'shell-topbar' }, [
      el('div', { class: 'shell-wordmark' }, [
        icon('wave'),
        el('span', { class: 'shell-wordmark-text' }, ['Interval Coach'])
      ]),
      el('button', {
        class: 'shell-profile-btn', 'aria-label': 'Settings',
        onclick: function () { state.screen = 'settings'; render(); }
      }, [icon('profile')])
    ]));

    var content = el('div', { class: 'shell-content' });
    if (state.screen === 'progress') content.appendChild(buildProgressContent());
    else if (state.screen === 'settings') content.appendChild(buildSettingsContent());
    else content.appendChild(buildWorkoutsContent());
    shell.appendChild(content);

    var tabbar = el('div', { class: 'shell-tabbar' });
    TABS.forEach(function (tab) {
      tabbar.appendChild(el('button', {
        class: 'shell-tab' + (state.screen === tab.id ? ' active' : ''),
        onclick: function () { state.screen = tab.id; render(); }
      }, [icon(tab.icon), el('span', { class: 'shell-tab-label' }, [tab.label])]));
    });
    shell.appendChild(tabbar);

    app.appendChild(shell);
  }

  function buildWorkoutsContent() {
    var scroll = el('div', { class: 'home-scroll' });

    scroll.appendChild(el('h1', { class: 'hero-title' }, ['Better intervals.', el('br'), 'Stronger you.']));
    scroll.appendChild(el('div', { class: 'hero-sub' }, ['Structured workouts. Real progress.']));

    var log = loadCompletionLog();
    var streak = currentStreak(log);

    scroll.appendChild(el('div', { class: 'stat-bar' }, [
      el('div', { class: 'stat-bar-item' }, [
        el('div', { class: 'stat-bar-value' }, [String(streak)]),
        el('div', { class: 'stat-bar-label' }, ['Day streak'])
      ]),
      el('div', { class: 'stat-bar-divider' }),
      el('div', { class: 'stat-bar-item' }, [
        el('div', { class: 'stat-bar-value' }, [String(log.length)]),
        el('div', { class: 'stat-bar-label' }, ['All-time'])
      ]),
      el('button', { class: 'stat-bar-new-btn', onclick: startNewWorkout }, ['+ New workout'])
    ]));

    scroll.appendChild(renderDashboardCard());

    scroll.appendChild(el('div', { class: 'section-label-row' }, [
      el('div', { class: 'section-label' }, ['Your workouts']),
      el('div', { class: 'rule' })
    ]));

    if (state.workouts.length === 0) {
      scroll.appendChild(el('div', { class: 'empty-state' }, [
        'No workouts yet. Build one with your own exercises — each gets its own number of sets, and its own rest time.'
      ]));
    } else {
      var list = el('div', { class: 'workout-list' });
      state.workouts.forEach(function (w) {
        var main = el('div', { class: 'workout-card-main', onclick: function () { openPlayer(w); } }, [
          el('div', { class: 'workout-card-icon' }, [icon('runner')]),
          el('div', { class: 'workout-card-text' }, [
            el('div', { class: 'workout-card-name' }, [w.name]),
            el('div', { class: 'workout-card-meta' }, [
              w.exercises.length + ' exercise' + (w.exercises.length === 1 ? '' : 's') + ' · ' +
              totalSetsCount(w) + ' sets total'
            ]),
            el('div', { class: 'workout-card-meta' }, [fmtClock(totalDuration(w)) + ' min. time'])
          ]),
          el('div', { class: 'workout-card-chevron' }, [icon('chevronRight')])
        ]);
        var actions = el('div', { class: 'card-actions' }, [
          el('button', { class: 'card-action-btn', onclick: function () { copyWorkoutCode(w); } }, [icon('dumbbell'), 'Share']),
          el('div', { class: 'card-actions-spacer' }),
          el('button', { class: 'card-action-btn icon-only', title: 'Edit', onclick: function () { startEditWorkout(w); } }, [icon('pencil')]),
          el('div', { class: 'card-actions-divider' }),
          el('button', { class: 'card-action-btn icon-only', title: 'Delete', onclick: function () { deleteWorkout(w.id); } }, [icon('close')])
        ]);
        list.appendChild(el('div', { class: 'workout-card' }, [main, actions]));
      });
      scroll.appendChild(list);
    }

    return scroll;
  }

  function buildProgressContent() {
    var scroll = el('div', { class: 'home-scroll' });
    var log = loadCompletionLog();
    var goal = loadWeeklyGoal();
    var streak = currentStreak(log);
    var weekCount = weekCompletionCount(log);

    scroll.appendChild(el('h1', { class: 'hero-title', style: 'margin-top:16px;' }, ['Your progress.']));
    scroll.appendChild(el('div', { class: 'hero-sub' }, ['Every workout you finish counts.']));

    scroll.appendChild(el('div', { class: 'stat-bar' }, [
      el('div', { class: 'stat-bar-item' }, [
        el('div', { class: 'stat-bar-value' }, [String(streak)]),
        el('div', { class: 'stat-bar-label' }, ['Day streak'])
      ]),
      el('div', { class: 'stat-bar-divider' }),
      el('div', { class: 'stat-bar-item' }, [
        el('div', { class: 'stat-bar-value' }, [String(weekCount) + '/' + String(goal)]),
        el('div', { class: 'stat-bar-label' }, ['This week'])
      ]),
      el('div', { class: 'stat-bar-divider' }),
      el('div', { class: 'stat-bar-item' }, [
        el('div', { class: 'stat-bar-value' }, [String(log.length)]),
        el('div', { class: 'stat-bar-label' }, ['All-time'])
      ])
    ]));

    scroll.appendChild(renderDashboardCard());

    scroll.appendChild(el('div', { class: 'section-label-row' }, [
      el('div', { class: 'section-label' }, ['Last 7 days']),
      el('div', { class: 'rule' })
    ]));

    var days = {};
    log.forEach(function (d) { days[d] = (days[d] || 0) + 1; });
    var week = el('div', { class: 'workout-card' });
    var weekInner = el('div', { style: 'padding:16px;display:flex;justify-content:space-between;gap:6px;' });
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var iso = isoDate(d);
      var count = days[iso] || 0;
      var col = el('div', { style: 'display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;' }, [
        el('div', {
          style: 'width:100%;max-width:28px;height:' + (10 + count * 18) + 'px;border-radius:6px;background:' + (count > 0 ? 'var(--accent)' : 'var(--border)') + ';'
        }),
        el('div', { style: 'font-size:0.62rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-soft);' }, [
          ['S', 'M', 'T', 'W', 'T', 'F', 'S'][d.getDay()]
        ])
      ]);
      weekInner.appendChild(col);
    }
    week.appendChild(weekInner);
    scroll.appendChild(week);

    return scroll;
  }

  function buildSettingsContent() {
    var scroll = el('div', { class: 'home-scroll' });

    scroll.appendChild(el('h1', { class: 'hero-title', style: 'margin-top:16px;' }, ['Settings.']));

    scroll.appendChild(el('div', { class: 'section-label-row' }, [
      el('div', { class: 'section-label' }, ['Goal']),
      el('div', { class: 'rule' })
    ]));
    var goalCard = el('div', { class: 'workout-card' }, [
      el('div', {
        class: 'workout-card-main', style: 'cursor:pointer;', onclick: openGoalOverlay
      }, [
        el('div', { class: 'workout-card-icon' }, [icon('calendar')]),
        el('div', { class: 'workout-card-text' }, [
          el('div', { class: 'workout-card-name' }, ['Weekly workout goal']),
          el('div', { class: 'workout-card-meta' }, [String(loadWeeklyGoal()) + ' workouts per week'])
        ]),
        el('div', { class: 'workout-card-chevron' }, [icon('chevronRight')])
      ])
    ]);
    scroll.appendChild(goalCard);

    scroll.appendChild(el('div', { class: 'section-label-row' }, [
      el('div', { class: 'section-label' }, ['Import']),
      el('div', { class: 'rule' })
    ]));
    var pasteCard = el('div', { class: 'workout-card' }, [
      el('div', {
        class: 'workout-card-main', style: 'cursor:pointer;', onclick: openPasteOverlay
      }, [
        el('div', { class: 'workout-card-icon' }, [icon('tag')]),
        el('div', { class: 'workout-card-text' }, [
          el('div', { class: 'workout-card-name' }, ['Paste a workout']),
          el('div', { class: 'workout-card-meta' }, ['Add one someone shared with you'])
        ]),
        el('div', { class: 'workout-card-chevron' }, [icon('chevronRight')])
      ])
    ]);
    scroll.appendChild(pasteCard);

    return scroll;
  }

  function renderDashboardCard() {
    var log = loadCompletionLog();
    var goal = loadWeeklyGoal();
    var weekCount = weekCompletionCount(log);
    var pct = Math.min(100, Math.round((weekCount / goal) * 100));
    var hitGoal = weekCount >= goal;

    var card = el('div', { class: 'dash-card' + (hitGoal ? ' dash-card-hit' : '') }, [
      el('div', { class: 'dash-eyebrow' }, [
        el('div', { class: 'dash-eyebrow-dash' }),
        el('div', { class: 'dash-eyebrow-label' }, ['This week'])
      ]),
      el('div', { class: 'dash-big' }, [String(weekCount) + '/' + String(goal)]),
      el('div', { class: 'dash-label' }, ['Workouts']),
      el('div', { class: 'dash-progress-track' }, [
        el('div', { class: 'dash-progress-fill', style: 'width:' + pct + '%;' })
      ]),
      el('button', { class: 'dash-footer', onclick: openGoalOverlay }, [
        icon('calendar'), el('span', {}, ['Edit weekly goal']), icon('chevronRight', 'icon-chevron')
      ])
    ]);

    return card;
  }

  function openGoalOverlay() {
    var overlay = el('div', { class: 'ic-overlay', onclick: function (e) { if (e.target === overlay) overlay.remove(); } });
    var input = el('input', { type: 'number', min: '1', value: String(loadWeeklyGoal()) });
    input.style.fontSize = '1.4rem';
    input.style.textAlign = 'center';

    var box = el('div', { class: 'ic-overlay-box' }, [
      el('span', { class: 'field-label' }, ['Workouts per week goal']),
      input,
      el('div', { class: 'ic-overlay-actions' }, [
        el('button', { class: 'ic-btn-secondary', onclick: function () { overlay.remove(); } }, ['Cancel']),
        el('button', {
          class: 'save-btn',
          onclick: function () {
            var n = Math.max(1, parseInt(input.value, 10) || 1);
            saveWeeklyGoal(n);
            overlay.remove();
            render();
          }
        }, ['Save goal'])
      ])
    ]);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    input.focus();
    input.select();
  }

  function deleteWorkout(id) {
    if (!confirm('Delete this workout?')) return;
    state.workouts = state.workouts.filter(function (w) { return w.id !== id; });
    saveWorkouts(state.workouts);
    render();
  }

  // ---------- Editor ----------

  function emptyExercise() { return { id: uid('ex'), name: '', sets: 3, work: 0, rest: 60 }; }
  function emptyWorkout() {
    return { id: uid('wk'), name: '', exercises: [emptyExercise()] };
  }

  function startNewWorkout() {
    state.editing = emptyWorkout();
    state.editingIsNew = true;
    state.screen = 'editor';
    render();
  }

  function startEditWorkout(w) {
    state.editing = JSON.parse(JSON.stringify(w));
    state.editingIsNew = false;
    state.screen = 'editor';
    render();
  }

  function renderEditor() {
    app.innerHTML = '';
    var w = state.editing;
    var screen = el('div', { class: 'screen' });
    var scroll = el('div', { class: 'editor-scroll' });

    scroll.appendChild(el('div', { class: 'editor-topbar' }, [
      el('button', { class: 'back-link', onclick: function () { state.screen = 'workouts'; render(); } }, ['←']),
      el('h2', {}, [state.editingIsNew ? 'New workout' : 'Edit workout'])
    ]));

    var nameField = el('div', { class: 'field' }, [
      el('span', { class: 'field-label' }, ['Workout name'])
    ]);
    var nameInput = el('input', { placeholder: 'Push day', value: w.name });
    nameInput.addEventListener('input', function (e) { w.name = e.target.value; updateSaveState(); });
    nameField.appendChild(nameInput);
    scroll.appendChild(nameField);

    scroll.appendChild(el('div', { class: 'section-label' }, ['Exercises']));
    scroll.appendChild(el('div', { class: 'section-hint' }, [
      'Each exercise runs its own sets, back to back, before moving to the next. Set Work to 0 for a self-paced lift — tap "Done" after each set instead of a countdown.'
    ]));

    scroll.appendChild(el('div', { class: 'col-labels' }, [
      el('span', {}, ['']), el('span', {}, ['Name']), el('span', {}, ['Sets']), el('span', {}, ['Work']), el('span', {}, ['Rest']), el('span', {}, [''])
    ]));

    var exerciseList = el('div', { id: 'exercise-list' });
    renderExerciseRows(exerciseList, w);
    scroll.appendChild(exerciseList);

    scroll.appendChild(el('button', {
      class: 'add-exercise-btn',
      onclick: function () {
        w.exercises.push(emptyExercise());
        renderExerciseRows(exerciseList, w);
        updateTotal();
        updateSaveState();
      }
    }, ['+ Add exercise']));

    var footer = el('div', { class: 'editor-footer' });
    var totalSpan = el('span', { class: 'total-time', id: 'total-time' }, ['Min. time: ' + fmtClock(totalDuration(w))]);
    var saveBtn = el('button', {
      class: 'save-btn', id: 'save-btn',
      onclick: function () {
        if (state.editingIsNew) state.workouts.push(w);
        else state.workouts = state.workouts.map(function (existing) { return existing.id === w.id ? w : existing; });
        saveWorkouts(state.workouts);
        state.screen = 'workouts';
        render();
      }
    }, ['Save workout']);
    footer.appendChild(totalSpan);
    footer.appendChild(saveBtn);
    scroll.appendChild(footer);

    screen.appendChild(scroll);
    app.appendChild(screen);

    function updateTotal() {
      document.getElementById('total-time').textContent = 'Min. time: ' + fmtClock(totalDuration(w));
    }
    function updateSaveState() {
      var ok = w.name.trim().length > 0 && w.exercises.every(function (ex) { return ex.name.trim().length > 0; });
      document.getElementById('save-btn').disabled = !ok;
    }
    updateSaveState();
    window.__editorUpdateTotal = updateTotal;
    window.__editorUpdateSaveState = updateSaveState;
  }

  function renderExerciseRows(container, w) {
    container.innerHTML = '';
    w.exercises.forEach(function (ex, i) {
      var nameInput = el('input', { class: 'name-input', placeholder: 'Exercise name', value: ex.name });
      nameInput.addEventListener('input', function (e) { ex.name = e.target.value; window.__editorUpdateSaveState(); });

      var setsInput = el('input', { class: 'time-input', type: 'number', min: '1', title: 'Sets', value: String(ex.sets) });
      setsInput.addEventListener('input', function (e) {
        ex.sets = Math.max(1, parseInt(e.target.value, 10) || 1);
        window.__editorUpdateTotal();
      });

      var workInput = el('input', {
        class: 'time-input', type: 'number', min: '0', title: 'Work seconds (0 = self-paced)', value: String(ex.work)
      });
      workInput.addEventListener('input', function (e) {
        ex.work = Math.max(0, parseInt(e.target.value, 10) || 0);
        window.__editorUpdateTotal();
      });

      var restInput = el('input', { class: 'time-input', type: 'number', min: '0', title: 'Rest seconds', value: String(ex.rest) });
      restInput.addEventListener('input', function (e) {
        ex.rest = Math.max(0, parseInt(e.target.value, 10) || 0);
        window.__editorUpdateTotal();
      });

      var removeBtn = el('button', {
        class: 'remove-btn', title: 'Remove',
        onclick: function () {
          if (w.exercises.length === 1) return;
          w.exercises.splice(i, 1);
          renderExerciseRows(container, w);
          window.__editorUpdateTotal();
          window.__editorUpdateSaveState();
        }
      }, ['✕']);

      container.appendChild(el('div', { class: 'exercise-row' }, [
        el('span', { class: 'idx' }, [String(i + 1)]),
        nameInput, setsInput, workInput, restInput, removeBtn
      ]));
    });
  }

  // ---------- Player ----------

  function openPlayer(workout) {
    var segments = buildSegments(workout);
    state.playing = {
      workout: workout,
      segments: segments,
      index: 0,
      remaining: segments.length ? (segments[0].seconds || 0) : 0,
      running: false,
      started: false,
      finished: false,
      lastAnnouncedCount: null
    };
    state.screen = 'player';
    render();
  }

  function stopTicking() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function startTicking() {
    stopTicking();
    tickTimer = setInterval(function () {
      var p = state.playing;
      if (!p || !p.running) return;
      p.remaining -= 1;
      if (p.remaining <= 0) {
        advanceToSegment(p.index + 1);
      } else if (p.remaining <= COUNT_FROM && p.lastAnnouncedCount !== p.remaining) {
        p.lastAnnouncedCount = p.remaining;
        announcer.speak(String(p.remaining));
      }
      renderPlayer();
    }, 1000);
  }

  // Moves the player onto segment `idx`, deciding whether it auto-counts down
  // (prepare/work/rest) or waits for a manual tap (self-paced lifting set).
  function advanceToSegment(idx) {
    var p = state.playing;
    if (idx >= p.segments.length) {
      p.finished = true;
      p.running = false;
      stopTicking();
      recordCompletion();
      announcer.speak('Workout complete. Great work.');
      return;
    }
    var seg = p.segments[idx];
    p.index = idx;
    p.remaining = seg.seconds || 0;
    p.lastAnnouncedCount = null;
    announcer.speak(seg.announce);
    if (seg.phase === 'manual') {
      p.running = false;
      stopTicking();
    } else {
      p.running = true;
      startTicking();
    }
  }

  function phaseClass(phase) {
    if (phase === 'work' || phase === 'manual') return phase;
    if (phase === 'rest') return 'rest';
    return 'prepare';
  }

  function phaseHeading(phase, seg) {
    if (phase === 'manual') return 'Set ' + seg.setNumber + ' of ' + seg.totalSets;
    if (phase === 'work') return 'Work';
    if (phase === 'rest') return 'Rest';
    return 'Prepare';
  }

  function renderPlayer() {
    app.innerHTML = '';
    var p = state.playing;
    var w = p.workout;
    var player = el('div', { class: 'player' });

    var closeAction = function () {
      stopTicking();
      announcer.cancel();
      state.screen = 'workouts';
      render();
    };

    player.appendChild(el('div', { class: 'player-topbar' }, [
      el('button', { class: 'icon-btn', onclick: closeAction, 'aria-label': 'Close' }, ['✕']),
      el('div', { class: 'player-title' }, [w.name]),
      el('div', { class: 'spacer36' })
    ]));

    if (!p.segments.length) {
      player.appendChild(el('div', { class: 'finished-screen' }, [
        el('div', {}, ['This workout has no exercises.'])
      ]));
      app.appendChild(player);
      return;
    }

    if (!p.started) {
      var summary = el('div', { class: 'presummary' }, [
        presummaryItem(String(w.exercises.length), 'Exercises'),
        presummaryItem(String(totalSetsCount(w)), 'Total sets'),
        presummaryItem(fmtClock(totalDuration(w)), 'Min. time')
      ]);
      player.appendChild(summary);

      var previewList = el('div', { class: 'preview-list' });
      w.exercises.forEach(function (ex, i) {
        var workText = ex.work > 0 ? (ex.work + 's work') : 'self-paced';
        previewList.appendChild(el('div', { class: 'preview-row' }, [
          el('span', { class: 'idx' }, [String(i + 1)]),
          el('span', { class: 'name' }, [ex.name]),
          el('span', { class: 'times' }, [ex.sets + ' sets · ' + workText + ' · ' + ex.rest + 's rest'])
        ]));
      });
      player.appendChild(previewList);

      player.appendChild(el('button', {
        class: 'start-btn',
        onclick: function () {
          p.started = true;
          advanceToSegment(0);
          renderPlayer();
        }
      }, ['START']));

      app.appendChild(player);
      return;
    }

    if (p.finished) {
      player.appendChild(el('div', { class: 'finished-screen' }, [
        el('div', { class: 'finished-heading' }, ['WORKOUT COMPLETE']),
        el('button', { class: 'start-btn', style: 'margin:0;', onclick: closeAction }, ['DONE'])
      ]));
      app.appendChild(player);
      return;
    }

    var seg = p.segments[p.index];
    var nextSeg = p.segments[p.index + 1];
    var isActiveStage = seg.phase === 'work' || seg.phase === 'manual';
    if (isActiveStage) player.classList.add('stage-active');

    var topline = el('div', { class: 'phase-topline' }, [
      el('div', { class: 'phase-topstat' }, [
        el('div', { class: 'phase-topstat-value' }, ['Set ' + seg.setNumber + '/' + seg.totalSets]),
        el('div', { class: 'phase-topstat-label' }, ['Sets'])
      ]),
      el('div', { class: 'phase-topstat' }, [
        el('div', { class: 'phase-topstat-value' }, [String(seg.exerciseNumber) + '/' + seg.totalExercises]),
        el('div', { class: 'phase-topstat-label' }, ['Exercise'])
      ])
    ]);

    if (seg.phase === 'manual') {
      var band = el('div', { class: 'phase-band manual' }, [
        topline,
        el('div', { class: 'phase-label' }, ['Self-paced set']),
        el('div', { class: 'phase-clock' }, [seg.setNumber + '/' + seg.totalSets]),
        el('div', { class: 'phase-exercise' }, [seg.label]),
        el('div', { class: 'phase-instructions' }, ['Do your reps, then tap below'])
      ]);
      player.appendChild(band);

      var isVeryLastSegment = p.index === p.segments.length - 1;
      var ctaLabel = isVeryLastSegment ? 'FINISH WORKOUT' : (nextSeg && nextSeg.phase === 'rest' ? 'DONE — START REST' : 'DONE — NEXT UP');
      player.appendChild(el('button', {
        class: 'start-btn',
        onclick: function () {
          advanceToSegment(p.index + 1);
          renderPlayer();
        }
      }, [ctaLabel]));

      app.appendChild(player);
      return;
    }

    var progressPct = seg.seconds > 0 ? Math.min(100, Math.max(0, ((seg.seconds - p.remaining) / seg.seconds) * 100)) : 0;

    var band2 = el('div', { class: 'phase-band ' + phaseClass(seg.phase) }, [
      topline,
      el('div', { class: 'phase-label' }, [phaseHeading(seg.phase, seg).toUpperCase()]),
      el('div', { class: 'phase-clock' }, [fmtClock(p.remaining)]),
      seg.phase !== 'prepare' ? el('div', { class: 'phase-exercise' }, [seg.label]) : null,
      nextSeg ? el('div', { class: 'phase-next' }, [
        'Up next: ' + (nextSeg.phase === 'rest' ? 'Rest' : nextSeg.label)
      ]) : null,
      el('div', { class: 'phase-progress-track' }, [
        el('div', { class: 'phase-progress-fill', style: 'width:' + progressPct + '%;' })
      ])
    ]);
    player.appendChild(band2);

    var stats = el('div', { class: 'player-stats' }, [
      el('button', {
        class: 'play-btn', 'aria-label': p.running ? 'Pause' : 'Resume',
        onclick: function () {
          p.running = !p.running;
          if (p.running) { announcer.speak(seg.announce); startTicking(); } else { announcer.cancel(); stopTicking(); }
          renderPlayer();
        }
      }, [p.running ? '❚❚' : '▶'])
    ]);
    player.appendChild(stats);

    app.appendChild(player);
  }

  function presummaryItem(value, label) {
    return el('div', { class: 'presummary-item' }, [
      el('div', { class: 'presummary-value' }, [value]),
      el('div', { class: 'presummary-label' }, [label])
    ]);
  }

  render();
})();
</script>
</body>
